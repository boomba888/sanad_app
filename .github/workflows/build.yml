name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Inject Code
        run: |
          mkdir temp_app
          cd temp_app
          flutter create . --org com.sanad.app --project-name sanad
          flutter pub add file_picker firebase_core firebase_auth
          cp ../lib/main.dart lib/main.dart
          if [ -f "../android/app/google-services.json" ]; then
            cp ../android/app/google-services.json android/app/google-services.json
          fi

      - name: Build APK
        run: |
          cd temp_app
          flutter build apk --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanad-apk
          path: temp_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          
